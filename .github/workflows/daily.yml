name: daily

# Collects the previous session's data and publishes the site.
#
# The generated JSON (~26MB, fully rewritten every run) is never committed:
# it goes straight from the runner into a Pages artifact, so repository
# history stays small no matter how long this runs.

on:
  schedule:
    # 21:00 KST = 12:00 UTC the SAME day, so Mon-Fri UTC maps to Mon-Fri KST.
    # The market closed at 15:30 and the after-hours session at 18:00, so the
    # day's candle is final well before this runs -- the site therefore carries
    # the CURRENT session's close, not the previous day's.
    #
    # Offset off the hour on purpose: GitHub queues scheduled runs under load
    # and :00 is the most contended minute.
    - cron: '13 12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'pipeline/**'
      - 'web/**'
      - '.github/workflows/daily.yml'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # only to raise the KRX key-expiry reminder

concurrency:
  group: pages
  # Each run rebuilds everything from scratch, so a newer run always supersedes
  # an older one. Cancelling also stops a throttled collection from blocking
  # the queue for its full timeout.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and analyse
        # KRX_AUTH_KEY is optional. Absent, the pipeline logs that it is missing
        # and keeps the estimated 거래대금; present, it fetches the real figures.
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python -m pipeline.run

      - name: Report output size
        run: |
          du -sh web/data
          echo "stock files: $(ls web/data/stocks | wc -l)"
          python -c "import json;m=json.load(open('web/data/meta.json'));print('거래대금 source:',m['amount_source'],'| KRX key days left:',m.get('krx_key_days_left'))"

      # The API cannot be asked when the key expires, and an expired key fails
      # softly -- turnover just reverts to estimates -- so the lapse would go
      # unnoticed. Raise an issue while there is still time to renew.
      - name: Remind about KRX key expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(python -c "import json;print(json.load(open('web/data/meta.json')).get('krx_key_days_left') or 9999)")
          echo "days left: $LEFT"
          [ "$LEFT" -gt 30 ] && exit 0
          TITLE="KRX 인증키 갱신 필요 (D-$LEFT)"
          if gh issue list --state open --search "KRX 인증키 갱신 필요 in:title" \
               --json title --jq '.[].title' | grep -q 'KRX 인증키 갱신'; then
            echo "reminder already open"; exit 0
          fi
          gh issue create --title "$TITLE" --body \
            "KRX OpenAPI 인증키가 곧 만료됩니다 (남은 기간 ${LEFT}일).
          갱신하지 않으면 거래대금이 조용히 추정치로 되돌아갑니다.

          1. https://openapi.krx.co.kr 에서 인증키 재발급
          2. 저장소 Secret \`KRX_AUTH_KEY\` 갱신
          3. 새 만료일을 저장소 Variable \`KRX_KEY_EXPIRES\` 에 \`YYYY-MM-DD\` 로 설정"

      # Pages pins Cache-Control: max-age=600 with no way to override it, so a
      # visitor can revalidate the HTML while still holding the previous JS.
      # Stamping a build version onto every asset URL keeps the two in step.
      - name: Stage site with cache-busted assets
        run: python -m pipeline.stage_site _site

      # No configure-pages step: every path is relative, so the site needs no
      # injected base path, and skipping it avoids depending on Pages admin
      # permissions the default GITHUB_TOKEN does not have.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
