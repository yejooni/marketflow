name: probe

# Temporary connectivity probe: confirms a GitHub-hosted runner (foreign IP) can
# reach the Korean data sources this project depends on. Each source is its own
# step with continue-on-error, so the per-step conclusions readable from the
# public jobs API tell us exactly which source works.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install
        run: pip install --quiet requests finance-datareader

      - name: runner-egress-ip
        continue-on-error: true
        run: curl -s --max-time 20 https://ipinfo.io/json

      - name: naver-sisejson
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, sys
          u = ("https://api.finance.naver.com/siseJson.naver?symbol=005930"
               "&requestType=1&startTime=20250801&endTime=20260731&timeframe=day")
          r = requests.get(u, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
          print("status", r.status_code, "len", len(r.text))
          print(r.text[:200])
          assert r.status_code == 200 and len(r.text) > 5000, "siseJson unusable"
          PY

      - name: naver-theme-list
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, re
          r = requests.get("https://finance.naver.com/sise/theme.naver?page=1",
                           headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
          r.encoding = "euc-kr"
          links = re.findall(r'type=theme&no=(\d+)"[^>]*>([^<]+)<', r.text)
          print("status", r.status_code, "themes", len(links))
          print(links[:3])
          assert r.status_code == 200 and len(links) >= 10, "theme list unusable"
          PY

      - name: fdr-krx-listing
        continue-on-error: true
        run: |
          python - <<'PY'
          import FinanceDataReader as fdr
          d = fdr.StockListing("KRX")
          print("shape", d.shape)
          print(d["Market"].value_counts().to_dict())
          assert len(d) > 2000, "listing unusable"
          PY

      - name: naver-throughput-50
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, time
          from concurrent.futures import ThreadPoolExecutor
          import FinanceDataReader as fdr
          codes = fdr.StockListing("KRX").query("Market in ['KOSPI','KOSDAQ']")["Code"].tolist()[:50]
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0"})
          def f(c):
              u = (f"https://api.finance.naver.com/siseJson.naver?symbol={c}&requestType=1"
                   f"&startTime=20250801&endTime=20260731&timeframe=day")
              try:
                  return len(s.get(u, timeout=30).text)
              except Exception:
                  return 0
          t0 = time.time()
          with ThreadPoolExecutor(max_workers=8) as ex:
              res = list(ex.map(f, codes))
          el = time.time() - t0
          bad = sum(1 for n in res if n < 1000)
          print(f"50 codes in {el:.1f}s, failures={bad}, est {el/50*2500/60:.1f} min for 2500")
          assert bad <= 2, f"{bad} failures out of 50"
          PY
